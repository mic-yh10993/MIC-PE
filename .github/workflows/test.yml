name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pester and syntax
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell syntax check
        shell: pwsh
        run: ./scripts/Test-Syntax.ps1 -Path ./src,./scripts,./tests

      - name: Run Pester
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1 -Output Detailed
