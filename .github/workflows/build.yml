name: Build MICPE

run-name: "MICPE ${{ inputs.stage }} ${{ inputs.build }} x64 zh-CN"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "构建到哪一期（m1 只有 cmd；m7 是完整成品）"
        type: choice
        options: [m1, m2, m3, m4, m5, m6, m7, wb2, all]
        default: m1
        required: true
      build:
        description: "UUP dump 构建号（26300 = 26H2 最新修订）"
        type: string
        default: "26300"
        required: true
      office:
        description: "内置 Office 2016 精简版（约 +170 MB 包）"
        type: boolean
        default: false
      chrome:
        description: "内置 Chrome 精简版（约 +130 MB 包）"
        type: boolean
        default: false
      probe:
        description: "注入 probe.cmd 自验证探针（false=交互调试镜像：不放 probe.cmd，停在 cmd 提示符，可手动跑 sc start）"
        type: boolean
        default: true
      nativeLogonExperiment:
        description: "原生登录实验：启用 -NativeLogonExperiment（提取登录文件、实验 startnet、不装 PECMD）"
        type: boolean
        default: false
      fetch_only:
        description: "只取官方底座镜像并生成文件清单，不构建 PE（22H2 参考重建的比对用）"
        type: boolean
        default: false
      clean:
        description: "纯净版重建：从官方 install.wim 只复制清单文件 + shell.zip，重建 boot.wim（22H2 参考 PE 路线，见 src/build/Build-CleanPe.ps1）"
        type: boolean
        default: false
      edition:
        description: "UUP 版本（professional=专业版，enterprise=企业版；参考 PE 是企业版）"
        type: string
        default: "professional"
      verify:
        description: "验证档位：full=含 QEMU 运行时自验证；static=只做静态与结构；none=只出产物"
        type: choice
        options: [full, static, none]
        default: full
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-micpe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ISO
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: |
          . ./src/build/lib/Common.ps1
          . ./src/build/lib/Disk.ps1
          $removed = Remove-RunnerBloat
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Free } |
            ForEach-Object { Write-Host ("{0}  free {1:N1} GB" -f $_.Root, ($_.Free / 1GB)) }

      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # wimlib and 7-Zip are the only extractors the build needs. Both
          # are called by bare name later (Build-Micpe.ps1 calls `7z`,
          # Wim.ps1 calls `wimlib-imagex`), so verify each one resolves
          # right after the install attempt and fail here instead of
          # 15 minutes later at first use. choco refreshes the machine
          # PATH on install, so re-read it before verifying.
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
          }
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7z not found on PATH after installing 7zip; the build cannot extract the ISO media'
          }

          if (-not (Get-Command wimlib-imagex -ErrorAction SilentlyContinue)) {
            choco install wimlib -y --no-progress
          }
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (Get-Command wimlib-imagex -ErrorAction SilentlyContinue)) {
            throw 'wimlib-imagex not found on PATH after installing wimlib; the build cannot extract files'
          }

          # oscdimg ships in the ADK. Installing the full ADK is slow, but the
          # deployment tools package is the documented source for it. The ADK
          # installer does not put oscdimg on PATH, so the build resolves it
          # explicitly; fail here instead of 15 minutes later at ISO time.
          $adkOscdimg = 'C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe'
          if (-not (Test-Path -LiteralPath $adkOscdimg)) {
            choco install windows-adk -y --no-progress --ignore-checksums
          }
          if (-not (Test-Path -LiteralPath $adkOscdimg) -and -not (Get-Command oscdimg -ErrorAction SilentlyContinue)) {
            throw 'oscdimg not found after installing windows-adk; the ISO step cannot run'
          }

          foreach ($tool in 'wimlib-imagex', 'oscdimg', '7z') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host ("{0} -> {1}" -f $tool, $cmd.Source) }
            else { Write-Host ("{0} not on PATH" -f $tool) }
          }

      - name: Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_STAGE: ${{ inputs.stage || 'all' }}
          IN_BUILD: ${{ inputs.build || '26300' }}
          IN_OFFICE: ${{ inputs.office }}
          IN_CHROME: ${{ inputs.chrome }}
          IN_PROBE: ${{ inputs.probe }}
          IN_NATIVE_LOGON_EXPERIMENT: ${{ inputs.nativeLogonExperiment }}
          IN_FETCH_ONLY: ${{ inputs.fetch_only }}
          IN_CLEAN: ${{ inputs.clean }}
          IN_EDITION: ${{ inputs.edition }}
        run: |
          if ($env:IN_CLEAN -eq 'true') {
            # Clean rebuild (22H2 reference PE): fixed build + edition,
            # the stage / office / chrome / probe / fetch-only inputs do
            # not apply. Build-CleanPe.ps1 exports ISO_PATH / BOOT_WIM_PATH
            # the same way, so the upload and Release steps below work
            # unchanged.
            ./src/build/Build-CleanPe.ps1 -Build '22621.1105' -Edition 'professional'
          }
          else {
            $buildArgs = @{ Stage = $env:IN_STAGE }
            if ($env:IN_BUILD) { $buildArgs.Build = $env:IN_BUILD }
            if ($env:IN_OFFICE -eq 'true') { $buildArgs.Office = $true }
            if ($env:IN_CHROME -eq 'true') { $buildArgs.Chrome = $true }
            if ($env:IN_PROBE -eq 'false') { $buildArgs.Probe = $false }
            if ($env:IN_NATIVE_LOGON_EXPERIMENT -eq 'true') { $buildArgs.NativeLogonExperiment = $true }
            if ($env:IN_FETCH_ONLY -eq 'true') { $buildArgs.FetchOnly = $true }
            if ($env:IN_EDITION) { $buildArgs.Edition = $env:IN_EDITION }

            ./src/build/Build-Micpe.ps1 @buildArgs
          }

      - name: Install QEMU
        if: inputs.verify == 'full' && (inputs.clean == true || (inputs.probe != false && inputs.nativeLogonExperiment != true))
        shell: pwsh
        run: |
          if (-not (Get-Command qemu-system-x86_64 -ErrorAction SilentlyContinue)) {
            choco install qemu -y --no-progress
          }
          $qemu = (Get-Command qemu-system-x86_64 -ErrorAction SilentlyContinue).Source
          if (-not $qemu) { $qemu = 'C:\Program Files\qemu\qemu-system-x86_64.exe' }
          if (-not (Test-Path -LiteralPath $qemu)) { throw 'qemu-system-x86_64 not found after install' }
          "QEMU_PATH=$qemu" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Ensure OVMF firmware
        if: inputs.verify == 'full' && (inputs.clean == true || (inputs.probe != false && inputs.nativeLogonExperiment != true))
        shell: pwsh
        run: |
          # QEMU ships its UEFI firmware next to the emulator (OVMF_CODE.fd
          # on old releases, edk2-x86_64-code.fd since QEMU 9.0; the
          # official 11.1.0 installer was verified to contain
          # share/edk2-x86_64-code.fd). The verifier needs UEFI: the
          # Windows ISO's EFI bootloader has no "Press any key" prompt, so
          # the whole sendkey problem disappears -- but only if the
          # firmware is really there. If it is not found, fail fast here
          # with a clear error instead of silently falling back to SeaBIOS
          # and burning 45 minutes at the boot prompt (runs 43912243734
          # through 43965120455 all died exactly that way).
          . ./src/ci/Invoke-QemuVerify.ps1 -ParseOnly
          $qemu = if ($env:QEMU_PATH) { $env:QEMU_PATH } else { 'qemu-system-x86_64' }
          $ovmf = Find-OvmfCode -QemuPath $qemu
          if (-not $ovmf) {
            throw 'No UEFI firmware found near the QEMU install (looked for OVMF_CODE.fd and edk2-x86_64-code.fd); cannot verify with UEFI'
          }
          Write-Host "firmware: $ovmf"
          "OVMF_PATH=$ovmf" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prepare data disks
        if: inputs.verify == 'full' && inputs.probe != false && inputs.nativeLogonExperiment != true && (inputs.stage == 'm6' || inputs.stage == 'm7' || inputs.stage == 'all')
        shell: pwsh
        run: |
          # plan Task 17 Step 6: three qcow2 data disks + one blank 64 GB disk
          # for the installer deploy smoke test. Windows cannot partition a
          # qcow2 directly, so each disk is built as a VHDX with diskpart
          # (partition + NTFS format + files), detached, then converted to
          # qcow2 with qemu-img. install.wim comes from the build step's
          # INSTALL_WIM_PATH (the base install.wim): the finished ISO no
          # longer carries one (user decision 2026-11-17 15:09), so it
          # cannot be extracted from the ISO anymore.
          $ErrorActionPreference = 'Stop'
          $diskDir = "$env:GITHUB_WORKSPACE\verify-disks"
          New-Item -ItemType Directory -Path $diskDir -Force | Out-Null
          $installWim = $env:INSTALL_WIM_PATH
          if (-not $installWim) { throw 'Prepare data disks: INSTALL_WIM_PATH is empty; the build step did not export it' }
          if (-not (Test-Path -LiteralPath $installWim)) { throw "Prepare data disks: install.wim not found at '$installWim'" }

          foreach ($letter in 'T', 'U', 'V', 'W') {
            if (Get-PSDrive -Name $letter -ErrorAction SilentlyContinue) {
              throw "drive letter ${letter}: is already in use; cannot stage data disks"
            }
          }

          function New-DataDisk {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [int] $SizeMb,
              [Parameter(Mandatory = $true)] [string] $Letter,
              [scriptblock] $Fill = $null
            )
            $vhdx = Join-Path $diskDir "$Name.vhdx"
            $create = @(
              "create vdisk file=`"$vhdx`" maximum=$SizeMb type=expandable"
              "select vdisk file=`"$vhdx`""
              'attach vdisk'
              'create partition primary'
              'format fs=ntfs quick'
              "assign letter=$Letter"
            ) -join "`n"
            $create | diskpart | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart failed while creating $Name" }
            try {
              if ($null -ne $Fill) { & $Fill }
            }
            finally {
              @("select vdisk file=`"$vhdx`"", 'detach vdisk') -join "`n" | diskpart | Out-Null
            }
            $qcow2 = Join-Path $diskDir "$Name.qcow2"
            & qemu-img convert -f vhdx -O qcow2 $vhdx $qcow2
            if ($LASTEXITCODE -ne 0) { throw "qemu-img convert failed for $Name" }
            Remove-Item -LiteralPath $vhdx -Force
            Write-Host "disk ready: $qcow2"
            return $qcow2
          }

          # disk2: blank NTFS, no marker. disk3: marker + real install.wim.
          # disk4: real install.wim, no marker. disk5: blank 64 GB target.
          $d2 = New-DataDisk -Name 'disk2' -SizeMb 2048 -Letter 'T'
          $d3 = New-DataDisk -Name 'disk3' -SizeMb 8192 -Letter 'U' -Fill {
            Set-Content -LiteralPath 'U:\install.mic' -Value 'MICPE 定制系统 v1' -Encoding utf8
            New-Item -ItemType Directory -Path 'U:\sources' -Force | Out-Null
            Copy-Item -LiteralPath $installWim -Destination 'U:\sources\install.wim'
          }
          $d4 = New-DataDisk -Name 'disk4' -SizeMb 8192 -Letter 'V' -Fill {
            New-Item -ItemType Directory -Path 'V:\sources' -Force | Out-Null
            Copy-Item -LiteralPath $installWim -Destination 'V:\sources\install.wim'
          }
          $d5 = New-DataDisk -Name 'disk5' -SizeMb 65536 -Letter 'W'

          $disks = @($d2, $d3, $d4, $d5) -join ';'
          "DATA_DISKS=$disks" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "data disks: $disks"

      - name: Verify in QEMU
        if: inputs.verify == 'full' && inputs.probe != false && inputs.nativeLogonExperiment != true && inputs.clean != true
        shell: pwsh
        env:
          IN_STAGE: ${{ inputs.stage || 'all' }}
          IN_ISO: ${{ env.ISO_PATH }}
          IN_OVMF: ${{ env.OVMF_PATH }}
        run: |
          # The ISO path is resolved by the runner into IN_ISO (the same
          # mechanism that already carries IN_STAGE and the upload steps'
          # ${{ env.ISO_PATH }}), instead of reading $env:ISO_PATH directly:
          # the previous run showed the runner's env display listing ISO_PATH
          # while the pwsh process saw an empty string, so the value is now
          # pinned at step setup. Diagnose first, bind second.
          Write-Host ("ISO_PATH env: [{0}]" -f $env:ISO_PATH)
          Write-Host ("IN_ISO env: [{0}]" -f $env:IN_ISO)
          $iso = if ($env:IN_ISO) { $env:IN_ISO } elseif ($env:ISO_PATH) { $env:ISO_PATH } else { '' }
          if (-not $iso) {
            throw 'Verify in QEMU: no ISO path was passed (IN_ISO and ISO_PATH are both empty); the build step did not export ISO_PATH'
          }
          if (-not (Test-Path -LiteralPath $iso)) {
            throw "Verify in QEMU: ISO file not found at '$iso'"
          }
          # The firmware path is resolved by the runner into IN_OVMF (same
          # step-level env mapping as IN_ISO above). UEFI is forced: the
          # "Ensure OVMF firmware" step already proved the file exists, so
          # a missing path here means the wiring broke, not the firmware.
          $ovmf = if ($env:IN_OVMF) { $env:IN_OVMF } elseif ($env:OVMF_PATH) { $env:OVMF_PATH } else { '' }
          if (-not $ovmf) {
            throw 'Verify in QEMU: no OVMF path was passed (IN_OVMF and OVMF_PATH are both empty); the Ensure OVMF firmware step did not export OVMF_PATH'
          }
          if (-not (Test-Path -LiteralPath $ovmf)) {
            throw "Verify in QEMU: OVMF firmware file not found at '$ovmf'"
          }
          $qemu = if ($env:QEMU_PATH) { $env:QEMU_PATH } else { 'qemu-system-x86_64' }
          $verifyArgs = @{
            Iso          = $iso
            Stage        = $env:IN_STAGE
            WorkDir      = "$env:GITHUB_WORKSPACE\verify-out"
            QemuPath     = $qemu
            TimeoutMin   = 45
            Firmware     = 'uefi'
            FirmwarePath = $ovmf
          }
          if ($env:DATA_DISKS) {
            # Data disks prepared: the deploy smoke test applies a whole
            # image under TCG, so give the run two hours instead of 45 min.
            $verifyArgs.DataDisks = $env:DATA_DISKS -split ';'
            $verifyArgs.TimeoutMin = 120
          }
          ./src/ci/Test-Stage.ps1 @verifyArgs

      # A clean rebuild has no probe.cmd, so the probe-based verifier above
      # cannot run against it. The clean verifier boots the ISO, logs in as
      # Administrator (blank password) with an Enter keypress at LogonUI,
      # opens the Start menu with the Windows key, and captures a screenshot
      # at each step. Screenshots are evidence for a human to review
      # (Explorer up, taskbar rendered, desktop icons, LogonUI login,
      # StartAllBack/Start11 in effect); the step passes when the
      # screenshots were captured, not on any guest-side assertion.
      - name: Verify clean build in QEMU
        if: inputs.verify == 'full' && inputs.clean == true
        shell: pwsh
        env:
          IN_ISO: ${{ env.ISO_PATH }}
          IN_OVMF: ${{ env.OVMF_PATH }}
        run: |
          $iso = if ($env:IN_ISO) { $env:IN_ISO } elseif ($env:ISO_PATH) { $env:ISO_PATH } else { '' }
          if (-not $iso) {
            throw 'Verify clean build in QEMU: no ISO path was passed (IN_ISO and ISO_PATH are both empty); the build step did not export ISO_PATH'
          }
          if (-not (Test-Path -LiteralPath $iso)) {
            throw "Verify clean build in QEMU: ISO file not found at '$iso'"
          }
          $ovmf = if ($env:IN_OVMF) { $env:IN_OVMF } elseif ($env:OVMF_PATH) { $env:OVMF_PATH } else { '' }
          if (-not $ovmf) {
            throw 'Verify clean build in QEMU: no OVMF path was passed (IN_OVMF and OVMF_PATH are both empty); the Ensure OVMF firmware step did not export OVMF_PATH'
          }
          if (-not (Test-Path -LiteralPath $ovmf)) {
            throw "Verify clean build in QEMU: OVMF firmware file not found at '$ovmf'"
          }
          $qemu = if ($env:QEMU_PATH) { $env:QEMU_PATH } else { 'qemu-system-x86_64' }
          # Round 29: the round 28 firmware freeze needs a no-KD
          # control pass -- same ISO, same QEMU arguments, same
          # screenshot timing; the only difference is that no debugger
          # attaches to the KD serial port (the -NoKdSession switch
          # also skips the pre-flight probe). The KD pass is the
          # product gate and decides the step; the control pass is
          # diagnostic evidence and never changes the verdict by
          # itself. Each pass gets its own WorkDir so its screenshots,
          # KD log and bugcheck report never overwrite the other's.
          $kdWorkDir = "$env:GITHUB_WORKSPACE\verify-clean-out"
          $controlWorkDir = "$env:GITHUB_WORKSPACE\verify-clean-out-control"
          # Round 30: the KD pass pre-stages the ntoskrnl PDB before
          # the session (Invoke-CleanSymbolPrestage) and needs the
          # built boot.wim for it. The Build step exported
          # BOOT_WIM_PATH to GITHUB_ENV; an empty value only skips
          # the pre-stage with a warning, it never fails the pass.
          # The control pass is unchanged (no BootWimPath, no
          # pre-stage): it must stay identical to round 29.
          $bootWim = if ($env:BOOT_WIM_PATH) { $env:BOOT_WIM_PATH } else { '' }
          $kdFailed = $false
          $kdError = ''
          try {
            $result = ./src/ci/Invoke-CleanQemuVerify.ps1 -IsoPath $iso -OvmfPath $ovmf -QemuPath $qemu -WorkDir $kdWorkDir -BootWimPath $bootWim
            Write-Host ("clean QEMU verify (KD pass): {0} of {1} screenshots in {2}" -f $result.ShotsTaken, $result.ShotsExpected, $result.ScreenshotDir)
          }
          catch {
            $kdFailed = $true
            $kdError = $_.Exception.Message
            Write-Host ("clean QEMU verify (KD pass) failed: {0}" -f $kdError)
          }
          $controlFailed = $false
          $controlError = ''
          try {
            $controlResult = ./src/ci/Invoke-CleanQemuVerify.ps1 -IsoPath $iso -OvmfPath $ovmf -QemuPath $qemu -WorkDir $controlWorkDir -NoKdSession
            Write-Host ("clean QEMU verify (control pass, no KD): {0} of {1} screenshots in {2}" -f $controlResult.ShotsTaken, $controlResult.ShotsExpected, $controlResult.ScreenshotDir)
          }
          catch {
            $controlFailed = $true
            $controlError = $_.Exception.Message
            Write-Host ("clean QEMU verify (control pass, no KD) failed: {0}" -f $controlError)
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              '## MICPE clean rebuild — QEMU screenshots'
              ''
              'Screenshots go to the Release for this run as shot-01..07.png (KD pass) and shot-control-01..07.png (no-KD control pass); backup: the `micpe-clean-verify` artifact. shot-01..03 boot -> LogonUI, shot-04..05 desktop after login, shot-06 Start menu, shot-07 desktop. Review them for: Explorer up, taskbar rendered, desktop icons, LogonUI login, StartAllBack/Start11 in effect.'
              ''
              "| KD pass | ``$(if ($kdFailed) { 'FAILED: ' + $kdError } else { 'passed' })`` |"
              "| Control pass (no KD) | ``$(if ($controlFailed) { 'FAILED: ' + $controlError } else { 'passed' })`` |"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if ($kdFailed) {
            throw ("clean QEMU verify (KD pass) failed: {0}" -f $kdError)
          }

      # A native-logon image never writes the classic micpe-probe.txt (its
      # startnet hands off to Winlogon instead of running probe.cmd), so the
      # QEMU probe chain above is skipped and static verification runs in
      # its place. Runtime evidence is written to X:\native-logon-probe.txt
      # by logon-admin.cmd and must be checked in the guest / QEMU screenshot.
      - name: Verify (static)
        if: inputs.verify == 'static' || (inputs.verify == 'full' && inputs.nativeLogonExperiment == true)
        shell: pwsh
        run: |
          if (-not $env:ISO_PATH -or -not (Test-Path -LiteralPath $env:ISO_PATH)) {
            throw 'ISO not found'
          }
          $iso = Get-Item -LiteralPath $env:ISO_PATH
          Write-Host ("ISO: {0:N2} GB" -f ($iso.Length / 1GB))
          & wimlib-imagex info $env:BOOT_WIM_PATH | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'wimlib-imagex info failed' }

      # Artifact uploads are a backup channel only: the Release (next step)
      # already carries the ISO, boot.wim and screenshots. Rounds 7-10 all
      # failed the run on "Artifact storage quota has been hit" even though
      # the account's artifact usage is 0 (GitHub's quota counter is stale
      # and only recalculates every 6-12 h), so a quota failure must not
      # mark the run failed. continue-on-error keeps the backup channel
      # (it self-heals when the counter recovers) without failing the run.
      - name: Upload ISO
        if: always() && env.ISO_PATH != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: micpe-iso-${{ inputs.stage || 'release' }}-${{ inputs.build || 'tag' }}
          path: ${{ env.ISO_PATH }}
          retention-days: 30
          compression-level: 0

      - name: Upload boot.wim
        if: always() && env.BOOT_WIM_PATH != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: micpe-bootwim-${{ inputs.stage || 'release' }}-${{ inputs.build || 'tag' }}
          path: ${{ env.BOOT_WIM_PATH }}
          retention-days: 30
          compression-level: 0

      - name: Upload verify artifacts
        if: always() && inputs.verify == 'full' && inputs.probe != false && inputs.nativeLogonExperiment != true && inputs.clean != true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: micpe-verify-${{ inputs.stage || 'release' }}-${{ inputs.build || 'tag' }}
          path: |
            verify-out/share/micpe-probe.txt
            verify-out/share/micpe-probe-local.txt
            verify-out/share/micpe-boot.log
            verify-out/share/micpe-watchdog-heartbeat.txt
            verify-out/share/micpe-tasklist.txt
            verify-out/share/micpe-selftest.txt
            verify-out/share/micpe-taskbar-wait-out.txt
            verify-out/share/micpe-events.txt
            verify-out/share/micpe-eventcreate.txt
            verify-out/share/micpe-wevt-gl-sys.txt
            verify-out/share/micpe-wevt-gl-sys.xml
            verify-out/share/micpe-wevt-gli-sys.txt
            verify-out/share/micpe-system.evtx
            verify-out/share/micpe-application.evtx
            verify-out/share/micpe-system-diag.evtx
            verify-out/share/micpe-application-diag.evtx
            verify-out/share/micpe-system-uwp.evtx
            verify-out/share/micpe-application-uwp.evtx
            verify-out/share/micpe-system-xcheck.evtx
            verify-out/share/micpe-application-xcheck.evtx
            verify-out/share/micpe-wer-explorer*.wer
            verify-out/share/micpe-minidump*
            verify-out/mirror/micpe-probe-local.txt
            verify-out/shots/*.ppm
            verify-out/qemu.log
            verify-out/micpe-serial.log
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload clean verify screenshots
        if: always() && inputs.verify == 'full' && inputs.clean == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: micpe-clean-verify-${{ inputs.build || 'tag' }}
          path: |
            verify-clean-out/screenshots/*.ppm
            verify-clean-out/micpe-kd.log
            verify-clean-out/micpe-kd-console.out
            verify-clean-out/micpe-kd-console.err
            verify-clean-out/micpe-kd-probe.txt
            verify-clean-out/micpe-kd-probe-*
            verify-clean-out/micpe-symbol-prestage.txt
            verify-clean-out/micpe-qemu.log
            verify-clean-out/micpe-bugcheck.txt
            verify-clean-out/micpe-dumpdisk-read.vhdx
            verify-clean-out/micpe-dumpdisk-read.vhd
            verify-clean-out-control/screenshots/*.ppm
            verify-clean-out-control/micpe-qemu.log
            verify-clean-out-control/micpe-bugcheck.txt
            verify-clean-out-control/micpe-dumpdisk-read.vhdx
            verify-clean-out-control/micpe-dumpdisk-read.vhd
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload finished build to Release
        # Long-term rule (user decision 2026-11-17 14:16): every finished
        # build uploads itself as a Release. Tag scheme:
        # micpe-<stage>-<build>-<yyyymmdd>-r<run_number> (never 'v*':
        # the workflow triggers on v* tag pushes, and a release tag must
        # not re-trigger a build). Only on manual runs: a v* tag push
        # already has its own release. Runs even when verification
        # failed (always()): the Release is the build artifact record;
        # the run report is the verdict on whether it is good.
        if: always() && github.event_name == 'workflow_dispatch' && env.ISO_PATH != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICPE_STAGE: ${{ inputs.stage }}
          MICPE_BUILD: ${{ inputs.build }}
          MICPE_CLEAN: ${{ inputs.clean }}
          MICPE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:MICPE_STAGE
          $build = $env:MICPE_BUILD
          if ($env:MICPE_CLEAN -eq 'true') { $stage = 'clean'; $build = '22621.1105' }
          $date = (Get-Date -Format 'yyyyMMdd')
          $runNumber = $env:MICPE_RUN_NUMBER
          $tag = "micpe-$stage-$build-$date-r$runNumber"
          $iso = $env:ISO_PATH
          $wim = $env:BOOT_WIM_PATH
          if (-not (Test-Path -LiteralPath $iso)) { throw "release upload: ISO not found at '$iso'" }
          if (-not (Test-Path -LiteralPath $wim)) { throw "release upload: boot.wim not found at '$wim'" }
          $isoBytes = (Get-Item -LiteralPath $iso).Length
          $wimBytes = (Get-Item -LiteralPath $wim).Length
          $isoHash = (Get-FileHash -LiteralPath $iso -Algorithm SHA256).Hash.ToLower()
          $wimHash = (Get-FileHash -LiteralPath $wim -Algorithm SHA256).Hash.ToLower()
          $checksums = Join-Path $env:GITHUB_WORKSPACE 'checksums.sha256'
          @("$isoHash  $(Split-Path -Leaf $iso)", "$wimHash  boot.wim") |
              Set-Content -LiteralPath $checksums -Encoding ASCII
          # QEMU screenshots (clean rebuild only): convert the PPM evidence
          # to PNG and attach it to this same Release. Run 45432615549
          # captured all 7 screenshots, but the `micpe-clean-verify`
          # artifact upload hit the storage-quota counter ("Artifact
          # storage quota has been hit") and the runner was destroyed with
          # the screenshots on it — no copy survived. The Release is the
          # durable channel (the ISO and boot.wim survived exactly because
          # they rode the Release); the artifact upload stays as a backup.
          # Missing screenshots (static/none verify, QEMU never came up)
          # simply mean no extras; the release still goes out.
          $releaseExtras = @()
          $shotDir = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out\screenshots'
          if (Test-Path -LiteralPath $shotDir) {
            $pngDir = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out\screenshots-png'
            . ./src/ci/Export-CleanScreenshots.ps1
            $releaseExtras = @(Export-CleanScreenshots -ScreenshotDir $shotDir -OutputDir $pngDir)
            foreach ($logName in 'micpe-kd.log', 'micpe-qemu.log', 'micpe-bugcheck.txt', 'micpe-kd-probe.txt', 'micpe-kd-console.out', 'micpe-kd-console.err', 'micpe-symbol-prestage.txt') {
              $logPath = Join-Path $env:GITHUB_WORKSPACE "verify-clean-out\$logName"
              if (Test-Path -LiteralPath $logPath) { $releaseExtras += $logPath }
            }
            # Round 27: per-variant probe console files
            # (micpe-kd-probe-<variant>.out/.err/.log).
            $cleanOutDir = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out'
            foreach ($probeFile in (Get-ChildItem -LiteralPath $cleanOutDir -Filter 'micpe-kd-probe-*' -File -ErrorAction SilentlyContinue)) {
              $releaseExtras += $probeFile.FullName
            }
            # Round 22: the crash-dump disk itself, preserved by the
            # verify script so the dump survives the runner. GitHub
            # caps release assets at 2 GB; a complete dump of a 4 GB
            # VM is ~4.3 GB, so an oversize disk is skipped with a log
            # line instead of failing the upload (the parameters in
            # micpe-bugcheck.txt are the primary evidence; the disk is
            # the backup for when Rizin could not parse it here).
            foreach ($diskName in 'micpe-dumpdisk-read.vhdx', 'micpe-dumpdisk-read.vhd') {
              $diskPath = Join-Path $env:GITHUB_WORKSPACE "verify-clean-out\$diskName"
              if (Test-Path -LiteralPath $diskPath) {
                $diskBytes = (Get-Item -LiteralPath $diskPath).Length
                if ($diskBytes -lt 1900MB) { $releaseExtras += $diskPath }
                else { Write-Host ("release extra skipped: {0} is {1:N0} bytes (over the ~1.9 GB Release asset limit)" -f $diskName, $diskBytes) }
              }
            }
            if ($releaseExtras.Count -gt 0) {
              Write-Host ("release extras: {0} files" -f $releaseExtras.Count)
            }
          }
          # Round 29: the no-KD control pass evidence rides the same
          # Release under distinct asset names -- the KD pass already
          # owns shot-01..07.png and micpe-bugcheck.txt, so the
          # control files are renamed to avoid collisions. The
          # control dump disk is NOT uploaded here (same file name as
          # the KD pass disk, and the bugcheck report is the primary
          # evidence); it stays in the micpe-clean-verify artifact.
          $controlExtrasAdded = $false
          $controlShotDir = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out-control\screenshots'
          if (Test-Path -LiteralPath $controlShotDir) {
            $controlPngDir = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out-control\screenshots-png'
            . ./src/ci/Export-CleanScreenshots.ps1
            foreach ($controlShot in @(Export-CleanScreenshots -ScreenshotDir $controlShotDir -OutputDir $controlPngDir)) {
              $controlLeaf = [System.IO.Path]::GetFileName($controlShot)
              if ($controlLeaf -match '^shot-(.+)$') { $controlName = ('shot-control-{0}' -f $Matches[1]) } else { $controlName = ('control-{0}' -f $controlLeaf) }
              $controlDest = Join-Path $controlPngDir $controlName
              if ($controlShot -ne $controlDest) { Move-Item -LiteralPath $controlShot -Destination $controlDest -Force }
              $releaseExtras += $controlDest
              $controlExtrasAdded = $true
            }
            $controlReport = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out-control\micpe-bugcheck.txt'
            if (Test-Path -LiteralPath $controlReport) {
              $controlReportCopy = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out-control\micpe-bugcheck-control.txt'
              Copy-Item -LiteralPath $controlReport -Destination $controlReportCopy -Force
              $releaseExtras += $controlReportCopy
              $controlExtrasAdded = $true
            }
            $controlQemuLog = Join-Path $env:GITHUB_WORKSPACE 'verify-clean-out-control\micpe-qemu.log'
            if (Test-Path -LiteralPath $controlQemuLog) {
              $releaseExtras += $controlQemuLog
              $controlExtrasAdded = $true
            }
          }
          $notes = @"
          MICPE $stage $build ($date), run $runNumber.
          ISO: $([math]::Round($isoBytes / 1MB, 1)) MB, SHA256 $isoHash
          boot.wim: $([math]::Round($wimBytes / 1MB, 1)) MB, SHA256 $wimHash
          The ISO carries only boot.wim (user decision 2026-11-17 15:09);
          install.wim is NOT included — supply your own.
          "@
          if ($releaseExtras.Count -gt 0) {
            $notes += "`nQEMU screenshots from the clean verify run are attached to this release."
            if ($controlExtrasAdded) {
              $notes += "`nThe no-KD control pass screenshots (shot-control-*.png) and report (micpe-bugcheck-control.txt) are attached too."
            }
          }
          # The upload itself lives in Publish-CleanRelease.ps1: core files
          # (ISO, boot.wim, checksums) go up with the release creation and
          # a failure there still fails the step; extras (PNGs, logs) are
          # uploaded one by one and a single bad file only warns. Run
          # 45448778057 lost the whole release because one combined upload
          # failed on micpe-qemu.log (HTTP 400 Bad Content-Length — the
          # QEMU -D log was empty and GitHub rejects empty release assets);
          # empty files are skipped with a warning before anything uploads.
          . ./src/ci/Publish-CleanRelease.ps1
          Publish-CleanRelease -Tag $tag -CoreFiles @($iso, $wim, $checksums) -ExtraFiles $releaseExtras `
              -Title "MICPE $stage $build ($date)" -Notes $notes

      - name: Upload base inventory to Release
        # Fetch-only deliverable: the file inventory JSON (official SHA256
        # of the reference PE's files). Runs only on a fetch-only dispatch
        # that produced an inventory; the normal Release step above is
        # gated on ISO_PATH and stays skipped. The install.wim itself is
        # never uploaded: it is too large for a Release asset, and the
        # rebuild re-fetches it on the runner.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.fetch_only && env.INVENTORY_PATH != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICPE_BUILD: ${{ inputs.build }}
          MICPE_EDITION: ${{ inputs.edition }}
          MICPE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = $env:MICPE_BUILD
          $edition = $env:MICPE_EDITION
          $date = (Get-Date -Format 'yyyyMMdd')
          $runNumber = $env:MICPE_RUN_NUMBER
          $tag = "micpe-base-$build-$edition-$date-r$runNumber"
          $inventory = $env:INVENTORY_PATH
          if (-not (Test-Path -LiteralPath $inventory)) { throw "release upload: inventory not found at '$inventory'" }
          $invBytes = (Get-Item -LiteralPath $inventory).Length
          $invHash = (Get-FileHash -LiteralPath $inventory -Algorithm SHA256).Hash.ToLower()
          $checksums = Join-Path $env:GITHUB_WORKSPACE 'inventory.sha256'
          @("$invHash  $(Split-Path -Leaf $inventory)") | Set-Content -LiteralPath $checksums -Encoding ASCII
          $notes = @"
          MICPE base inventory $build ($edition), $date, run $runNumber.
          Official install.wim file inventory (SHA256) for the reference PE's
          file list. Inventory: $([math]::Round($invBytes / 1KB, 1)) KB, SHA256 $invHash.
          The install.wim itself is not uploaded (too large for a Release asset).
          "@
          $existing = & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $inventory $checksums --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & gh release create $tag $inventory $checksums --repo $env:GITHUB_REPOSITORY `
              --title "MICPE base inventory $build ($edition)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $tag" }
          Write-Host "released $tag"
