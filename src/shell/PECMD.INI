; MICPE PECMD configuration (M2).
; Loaded by startnet.cmd: PECMD.EXE LOAD X:\Program Files\MICPE\PECMD.INI
; Keep it minimal: start Explorer, wait for the shell to settle, start the
; input-method monitor, pin the desktop shortcuts, then run the self-check.
; NOTE: PECMD command syntax here is a first draft. It is confirmed by the L3
; QEMU run (probe.txt + screenshot), not by this file alone.

[INIT]
EXEC %SystemRoot%\explorer.exe
WAIT 3000
EXEC %SystemRoot%\System32\ctfmon.exe
CALL %SystemRoot%\System32\Pin-Shortcuts.wcs
CALL %SystemRoot%\System32\probe.cmd
